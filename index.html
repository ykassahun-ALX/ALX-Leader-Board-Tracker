<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALX Leaderboard Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d1117;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }

    .controls {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center;
      margin-bottom: 12px; background: #161b22; padding: 14px 22px; border-radius: 10px;
      max-width: 1000px;
    }
    .controls label { font-weight: 600; color: #00ff88; font-size: 14px; }
    .controls select, .controls button, .controls input[type="file"] {
      padding: 8px 12px; border-radius: 6px; border: 1px solid #30363d;
      background: #21262d; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .controls button:hover { background: #238636; border-color: #2e9d45; }
    .controls .check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #c9d1d9; font-weight: 500; }
    .hidden { display: none !important; }

    #status { min-height: 20px; margin-bottom: 14px; font-size: 13px; color: #8b949e; text-align: center; }
    #status.error { color: #ff7b72; }
    #status.ok { color: #00ff88; }

    /* ---------- Card (1000 x 562, matches template.png) ---------- */
    .card {
      width: 1000px;
      height: 562px;
      flex: none;
      background: #1a1e43 url('template.png') center / 1000px 562px no-repeat;
      font-family: "Poppins", -apple-system, "Segoe UI", Arial, sans-serif;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
    }

    .title, .footer {
      position: absolute; display: flex; align-items: center; justify-content: center;
      color: #ffcc00; font-weight: 700; text-align: center; overflow: hidden;
    }
    .title  { left: 151px; width: 760px; top: 56px; height: 66px; font-size: 28px; line-height: 1.15; text-wrap: balance; }
    .footer { left: 233px; width: 560px; top: 481px; height: 36px; font-size: 20px; white-space: nowrap; }

    .row { position: absolute; height: 21.5px; }
    .pill {
      position: absolute; inset: 0; border-radius: 11px;
      background: #002b56; box-shadow: 0 1px 3px rgba(0,0,0,.35);
    }
    .badge {
      position: absolute; left: 18.6px; top: -1.4px; width: 56px; height: 21.5px; border-radius: 11px;
      background: #fbd437; color: #002b56; font-size: 11.5px; font-weight: 800;
      display: flex; align-items: center; justify-content: center; line-height: 1;
    }
    .row.left  { left: 44.4px; width: 440.4px; }
    .row.right { left: 503px;  width: 440.3px; }
    .student-name, .class-tag { position: absolute; top: 0; line-height: 21.5px; height: 21.5px; white-space: nowrap; }
    .student-name { left: 81.6px; right: 125px; font-size: 12px; font-weight: 700; color: #fff; overflow: hidden; }
    .class-tag    { right: 17.8px; font-size: 11px; font-weight: 700; color: #00ff88; }

    .card.guides .pill { outline: 1px dashed rgba(255, 0, 120, .8); }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

  <div class="controls">
    <label for="programSelect">Program:</label>
    <select id="programSelect"></select>

    <label for="pageSelect" id="pageLabel" class="hidden">Page:</label>
    <select id="pageSelect" class="hidden"></select>

    <label for="excelFileInput">Spreadsheet:</label>
    <input type="file" id="excelFileInput" accept=".xlsx,.xls,.csv">

    <label class="check"><input type="checkbox" id="guideToggle"> Show alignment guides</label>
    <button id="downloadBtn">Download PNG</button>
    <button id="downloadAllBtn" class="hidden">Download all pages</button>
  </div>
  <div id="status">Upload your workbook: each tab is one program, with columns Full Name and Status.</div>

  <div class="card" id="leaderboardCard">
    <div class="title" id="cardTitle"></div>
    <div id="rows"></div>
    <div class="footer" id="footerText"></div>
  </div>

  <script>
    const PER_PAGE = 20;       // names per card (10 per column)
    const COL_ROWS = 10;
    const LEFT_TOPS  = [178.5, 204.8, 232.6, 260.4, 287.8, 315.6, 343.0, 371.1, 398.9, 427.0];
    const RIGHT_TOPS = LEFT_TOPS.map(y => y + 2.2);

    // Names in the left column for a given card: fills to 10, otherwise split evenly
    const leftCount = n => n > COL_ROWS ? COL_ROWS : Math.ceil(n / 2);

    let programData = {
      "AiCE": [
        { name: "Amanuel Lulie W", cls: "AICE-6_rolling" }, { name: "Asmare Getie", cls: "AICE-6_rolling" },
        { name: "Bereket Yidneka", cls: "AICE-6_rolling" }, { name: "Bella Rosewood", cls: "AICE-6_rolling" },
        { name: "Liya Nidaw", cls: "AICE-6_rolling" },      { name: "Martha Kifle", cls: "AICE-6_rolling" },
        { name: "Rufeyda Hassen", cls: "AICE-6_rolling" },  { name: "Yeabsera Bekele", cls: "AICE-6_rolling" },
        { name: "AMANUEL GETA", cls: "AICE-5_rolling" },    { name: "Biruktawit Kefele", cls: "AICE-5_rolling" },
        { name: "Fuad Tesfaye", cls: "AICE-5_rolling" },    { name: "Natnael Fantaw", cls: "AICE-5_rolling" },
        { name: "Rahel Asres", cls: "AICE-5_rolling" },     { name: "Zeamanuel Lega", cls: "AICE-5_rolling" }
      ]
    };

    const $ = id => document.getElementById(id);
    const select = $("programSelect");
    const pageSelect = $("pageSelect");
    let currentPage = 0;

    function setStatus(msg, type = "") {
      const el = $("status");
      el.textContent = msg;
      el.className = type;
    }

    function populateDropdown(selected) {
      select.innerHTML = "";
      Object.keys(programData).forEach(p => select.add(new Option(p, p)));
      if (selected && programData[selected]) select.value = selected;
    }

    function pageCount() {
      return Math.max(1, Math.ceil((programData[select.value] || []).length / PER_PAGE));
    }

    function populatePages() {
      const pages = pageCount();
      pageSelect.innerHTML = "";
      for (let p = 0; p < pages; p++) {
        const total = (programData[select.value] || []).length;
        const from = p * PER_PAGE + 1, to = Math.min(total, (p + 1) * PER_PAGE);
        pageSelect.add(new Option(`${p + 1} of ${pages} (#${from}-${to})`, p));
      }
      pageSelect.value = currentPage;
      const multi = pages > 1;
      ["pageSelect", "pageLabel", "downloadAllBtn"].forEach(id => $(id).classList.toggle("hidden", !multi));
    }

    /* ---------------- Spreadsheet parsing ---------------- */
    const PROGRAM_ALIASES = { "ai career essentials": "AiCE" };
    const SKIP_TABS = /raw|template|instructions/i;

    const EXCLUDE_CLASS = {
      "founder academy":    /^FA-1(?!\d)/i,
      "freelancer academy": /^FLA-1(?!\d)/i
    };

    function programFromTab(tab) {
      const base = tab.split("_")[0].trim();
      return PROGRAM_ALIASES[base.toLowerCase()] || base;
    }

    function findCol(headers, test, exclude = []) {
      return headers.findIndex((h, i) => !exclude.includes(i) && test(h));
    }

    function parseSheet(rows, defaultProg) {
      const headerIdx = rows.findIndex(r => r && r.some(c => String(c ?? "").trim() !== ""));
      if (headerIdx === -1) return {};

      const headers = rows[headerIdx].map(h => String(h ?? "").trim().toLowerCase());
      const rankCol = findCol(headers, h => /^(rank|position|#)$/.test(h));
      const nameCol = findCol(headers, h => /name|student/.test(h));
      const progCol = findCol(headers, h => /program|track|course/.test(h), [nameCol]);
      const clsCol  = findCol(headers, h => /class|cohort|batch|status|code/.test(h), [nameCol, progCol]);

      if (nameCol === -1) return {};

      const currentProg = defaultProg || "Leaderboard";
      const groups = {};

      rows.slice(headerIdx + 1).forEach((r, i) => {
        const name = String(r?.[nameCol] ?? "").trim();
        if (!name) return;
        const prog = progCol !== -1 ? String(r[progCol] ?? "").trim() : "";
        const label = prog || currentProg;
        const key = label.toLowerCase();
        (groups[key] ??= { label, list: [] }).list.push({
          name,
          cls: clsCol !== -1 ? String(r[clsCol] ?? "").trim() : "",
          rank: rankCol !== -1 ? parseFloat(r[rankCol]) : NaN,
          order: i
        });
      });

      const result = {};
      Object.values(groups).forEach(({ label, list }) => {
        list.sort((a, b) => (isNaN(a.rank) || isNaN(b.rank)) ? a.order - b.order : a.rank - b.rank);
        result[label] = list;
      });
      return result;
    }

    $("excelFileInput").addEventListener("change", e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const wb = XLSX.read(new Uint8Array(ev.target.result), { type: "array" });
          const parsed = {};
          wb.SheetNames.forEach(tab => {
            if (SKIP_TABS.test(tab)) return;
            const rows = XLSX.utils.sheet_to_json(wb.Sheets[tab], { header: 1, defval: "", blankrows: false });
            const headerRow = (rows[0] || []).map(h => String(h).toLowerCase());
            if (headerRow.some(h => h.includes("email"))) return;
            const result = parseSheet(rows, programFromTab(tab));
            Object.entries(result).forEach(([prog, list]) => {
              const rule = EXCLUDE_CLASS[prog.toLowerCase()];
              if (rule) list = list.filter(s => !rule.test(s.cls));
              if (list.length) parsed[prog] = (parsed[prog] || []).concat(list);
            });
          });
          if (!Object.keys(parsed).length) throw new Error('No student tabs found. Each tab needs a "Full Name" column.');

          programData = parsed;
          currentPage = 0;
          populateDropdown(Object.keys(parsed)[0]);
          populatePages();
          render();

          const total = Object.values(parsed).reduce((n, l) => n + l.length, 0);
          const multi = Object.entries(parsed).filter(([, l]) => l.length > PER_PAGE)
            .map(([p, l]) => `${p} (${Math.ceil(l.length / PER_PAGE)} pages)`);
          setStatus(
            `Imported ${total} students in ${Object.keys(parsed).length} program(s).` +
            (multi.length ? ` Split across multiple cards: ${multi.join(", ")}.` : ""),
            "ok"
          );
        } catch (err) {
          setStatus(err.message || "Could not read that file.", "error");
        }
      };
      reader.readAsArrayBuffer(file);
      e.target.value = "";
    });

    /* ---------------- Rendering ---------------- */
    function fitName(el) {
      let size = 12;
      el.style.fontSize = size + "px";
      while (el.scrollWidth > el.clientWidth && size > 8) { size -= 0.5; el.style.fontSize = size + "px"; }
    }

    function fitTitle(el) {
      let size = 28;
      el.style.fontSize = size + "px";
      while (el.scrollHeight > el.clientHeight && size > 16) { size -= 1; el.style.fontSize = size + "px"; }
    }

    function render() {
      const prog = select.value;
      const all = programData[prog] || [];
      const total = all.length;
      const start = currentPage * PER_PAGE;
      const students = all.slice(start, start + PER_PAGE);
      const nLeft = leftCount(students.length);

      $("cardTitle").textContent  = `${prog} Leaderboard\u00A0- Meet the Current Top ${total}!`;
      $("footerText").textContent = `Who will climb into the top ${total} next?`;
      fitTitle($("cardTitle"));

      const host = $("rows");
      host.innerHTML = "";

      students.forEach((s, i) => {
        const isLeft = i < nLeft;
        const slot = isLeft ? i : i - nLeft;

        const row = document.createElement("div");
        row.className = "row " + (isLeft ? "left" : "right");
        row.style.top = (isLeft ? LEFT_TOPS[slot] : RIGHT_TOPS[slot]) + "px";

        const pill = document.createElement("div");  pill.className = "pill";
        const badge = document.createElement("div"); badge.className = "badge"; badge.textContent = start + i + 1;
        const name = document.createElement("div");  name.className = "student-name"; name.textContent = s.name;
        const tag = document.createElement("div");   tag.className = "class-tag"; tag.textContent = s.cls;

        row.append(pill, badge, name, tag);
        host.appendChild(row);
        fitName(name);
      });
    }

    select.addEventListener("change", () => { currentPage = 0; populatePages(); render(); });
    pageSelect.addEventListener("change", () => { currentPage = parseInt(pageSelect.value, 10); render(); });
    $("guideToggle").addEventListener("change", e => $("leaderboardCard").classList.toggle("guides", e.target.checked));

    /* ---------------- Download ---------------- */
    async function captureCurrent(suffix = "") {
      const card = $("leaderboardCard");
      await document.fonts.ready;
      const canvas = await html2canvas(card, { scale: 3, useCORS: true, backgroundColor: null });
      const a = document.createElement("a");
      a.download = `${select.value.replace(/[^\w-]+/g, "_")}_Leaderboard${suffix}.png`;
      a.href = canvas.toDataURL("image/png");
      a.click();
    }

    async function withoutGuides(fn) {
      const card = $("leaderboardCard");
      const wasGuides = card.classList.contains("guides");
      card.classList.remove("guides");
      try { await fn(); }
      catch (err) {
        setStatus("Download failed. Open the page via GitHub Pages (not file://) so template.png can be read.", "error");
      } finally {
        if (wasGuides) card.classList.add("guides");
      }
    }

    $("downloadBtn").addEventListener("click", () =>
      withoutGuides(() => captureCurrent(pageCount() > 1 ? `_Part${currentPage + 1}` : "")));

    $("downloadAllBtn").addEventListener("click", () =>
      withoutGuides(async () => {
        const original = currentPage;
        const pages = pageCount();
        for (let p = 0; p < pages; p++) {
          currentPage = p;
          pageSelect.value = p;
          render();
          await new Promise(r => setTimeout(r, 150));   // let layout settle
          await captureCurrent(`_Part${p + 1}`);
          await new Promise(r => setTimeout(r, 400));   // avoid the browser blocking multiple downloads
        }
        currentPage = original;
        pageSelect.value = original;
        render();
        setStatus(`Downloaded ${pages} images.`, "ok");
      }));

    populateDropdown("AiCE");
    populatePages();
    render();
  </script>
</body>
</html>
